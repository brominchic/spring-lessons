server:
  port: 9999
  servlet:
    context-path: /example-application
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmers}
    username: ${SPRING_DATASOURCE_USERNAME:farmers}
    password: ${SPRING_DATASOURCE_PASSWORD:farmers}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
